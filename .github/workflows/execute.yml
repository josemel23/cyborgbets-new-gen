name: Panel Scraper

on:
  workflow_dispatch:
    inputs:
      accion:
        required: true
        type: choice
        options:
          - scraper
          - deploy
          - scraper_and_deploy
      liga:
        required: false
        type: choice
        default: liga_mx
        options:
          - arabia
          - argentina
          - australia
          - austria
          - belgica
          - bolivia
          - brasil
          - brasil_b
          - bulgaria
          - bundesliga
          - bundesliga_2
          - championship
          - checa
          - chile
          - china
          - croacia
          - dinamarca
          - ecuador
          - rumania
          - eerste_divisie
          - eredivisie
          - escocia
          - estonia
          - francia
          - francia_2
          - grecia
          - italia
          - italia_2
          - israel
          - j1_league
          - la_liga
          - libertadores
          - liga_betplay
          - liga_hypermotion
          - liga_mx
          - mls
          - nba
          - noruega
          - portugal
          - portugal_2
          - premier
          - sudamerica
          - suecia
          - suiza
          - turquia

jobs:
  scraper:
    runs-on: ubuntu-latest
    if: inputs.accion == 'scraper' || inputs.accion == 'scraper_and_deploy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Chrome
        run: |
          # Instalar Chrome estable
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb
          
          # Verificar versión de Chrome instalada
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "✅ Chrome instalado: $CHROME_VERSION"
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV
          
          # Instalar dependencias
          sudo apt-get update -qq
          sudo apt-get install -y xvfb unzip curl jq
          
      - name: Download Matching ChromeDriver
        run: |
          echo "📥 Descargando ChromeDriver para Chrome $CHROME_VERSION..."
          
          # Intentar descargar ChromeDriver de la versión exacta
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chromedriver-linux64.zip"
          
          echo "Intentando: $CHROMEDRIVER_URL"
          if wget -q --spider "$CHROMEDRIVER_URL"; then
            echo "✅ Encontrada versión exacta"
            wget -q "$CHROMEDRIVER_URL" -O chromedriver.zip
          else
            echo "⚠️  Versión exacta no disponible, buscando versión compatible..."
            
            # Extraer solo versión principal (ej: 145)
            CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
            echo "Versión principal: $CHROME_MAJOR"
            
            # Buscar última versión disponible de Chrome for Testing
            LATEST_VERSIONS_URL="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
            STABLE_VERSION=$(curl -s "$LATEST_VERSIONS_URL" | jq -r '.channels.Stable.version')
            
            echo "Versión estable disponible: $STABLE_VERSION"
            CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/$STABLE_VERSION/linux64/chromedriver-linux64.zip"
            
            echo "Descargando: $CHROMEDRIVER_URL"
            wget -q "$CHROMEDRIVER_URL" -O chromedriver.zip
          fi
          
          # Extraer y colocar ChromeDriver
          unzip -q chromedriver.zip
          
          # Crear directorio de caché de undetected-chromedriver
          mkdir -p ~/.local/share/undetected_chromedriver/
          
          # Copiar chromedriver al lugar donde undetected-chromedriver lo busca
          cp chromedriver-linux64/chromedriver ~/.local/share/undetected_chromedriver/undetected_chromedriver
          chmod +x ~/.local/share/undetected_chromedriver/undetected_chromedriver
          
          # También en PATH
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          
          # Limpiar
          rm -rf chromedriver.zip chromedriver-linux64/
          
          # Verificar
          DRIVER_VERSION=$(chromedriver --version)
          echo "✅ ChromeDriver instalado: $DRIVER_VERSION"
          
      - name: Setup Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV
          
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir undetected-chromedriver==3.5.5
          pip install --no-cache-dir selenium==4.15.2
          pip install pandas requests beautifulsoup4
          echo "✅ Dependencias Python instaladas"
          
      - name: Run scraper
        run: |
          if [ "${{ inputs.liga }}" = "nba" ]; then
            echo "🏀 Ejecutando scraper NBA desde raíz..."
            python3 nba.py 2>&1 || echo "❌ Error en nba.py - código: $?"
          else
            echo "⚽ Ejecutando scraper de fútbol..."
            cd "scraper/${{ inputs.liga }}"
            timeout 600 python3 "${{ inputs.liga }}_standings.py"
          fi
          
      - name: Move files to correct location
        run: |
          echo "📁 Moviendo archivos a la ubicación correcta..."
          
          case "${{ inputs.liga }}" in
            "la_liga") FILE_NAME="la_liga_data.json" ;;
            "liga_hypermotion") FILE_NAME="liga_hypermotion_data.json" ;;
            "premier") FILE_NAME="premier_league_data.json" ;;
            "austria") FILE_NAME="austria_data.json" ;;
            "championship") FILE_NAME="championship_data.json" ;;
            "bundesliga") FILE_NAME="bundesliga_data.json" ;;
            "bundesliga_2") FILE_NAME="bundesliga_2_data.json" ;;
            "rumania") FILE_NAME="rumania_data.json" ;;
            "italia") FILE_NAME="serie_a_data.json" ;;
            "israel") FILE_NAME="israel_data.json" ;;
            "italia_2") FILE_NAME="serie_b_data.json" ;;
            "francia") FILE_NAME="ligue_1_data.json" ;;
            "francia_2") FILE_NAME="ligue_2_data.json" ;;
            "eredivisie") FILE_NAME="eredivisie_data.json" ;;
            "dinamarca") FILE_NAME="dinamarca_data.json" ;;
            "eerste_divisie") FILE_NAME="eerste_divisie_data.json" ;;
            "portugal") FILE_NAME="primeira_liga_data.json" ;;
            "portugal_2") FILE_NAME="liga_portugal_2_data.json" ;;
            "argentina") FILE_NAME="primera_division_argentina_data.json" ;;
            "brasil") FILE_NAME="serie_a_brasil_data.json" ;;
            "brasil_b") FILE_NAME="serie_b_brasil_data.json" ;;
            "bulgaria") FILE_NAME="bulgaria_data.json" ;;
            "liga_mx") FILE_NAME="liga_mx_data.json" ;;
            "arabia") FILE_NAME="saudi-arabia_data.json" ;;
            "liga_betplay") FILE_NAME="liga_betplay_data.json" ;;
            "estonia") FILE_NAME="meistriliiga_data.json" ;;
            "escocia") FILE_NAME="scotland_premiership_data.json" ;;
            "j1_league") FILE_NAME="j1_league_data.json" ;;
            "china") FILE_NAME="super_league_china_data.json" ;;
            "suecia") FILE_NAME="allsvenskan_data.json" ;;
            "belgica") FILE_NAME="pro_league_belgium_data.json" ;;
            "noruega") FILE_NAME="eliteserien_data.json" ;;
            "suiza") FILE_NAME="super_league_suiza_data.json" ;;
            "turquia") FILE_NAME="super_lig_turkey_data.json" ;;
            "ecuador") FILE_NAME="serie_a_ecuador_data.json" ;;
            "mls") FILE_NAME="mls_usa_data.json" ;;
            "nba") FILE_NAME="nba_*.json" ;;
            "australia") FILE_NAME="a_league_australia_data.json" ;;
            "grecia") FILE_NAME="super_league_greece_data.json" ;;
            "chile") FILE_NAME="primera_division_chile_data.json" ;;
            "checa") FILE_NAME="checa_data.json" ;;
            "croacia") FILE_NAME="croacia_data.json" ;;
            "libertadores") FILE_NAME="libertadores_data.json" ;;
            "sudamerica") FILE_NAME="sudamericana_data.json" ;;
            "bolivia") FILE_NAME="Lfpb.json" ;;
            *) FILE_NAME="${{ inputs.liga }}_data.json" ;;
          esac
          
          if [ "${{ inputs.liga }}" = "nba" ]; then
            for nba_file in nba_standings.json nba_player_stats.json nba_games.json; do
              [ -f "$nba_file" ] && cp "$nba_file" "public/static/"
              [ -f "public/static/$nba_file" ] && echo "✅ $nba_file copiado"
            done
          else
            if [ -f "scraper/${{ inputs.liga }}/public/static/$FILE_NAME" ]; then
              cp "scraper/${{ inputs.liga }}/public/static/$FILE_NAME" "public/static/"
              echo "✅ Archivo copiado"
            elif [ -f "scraper/${{ inputs.liga }}/$FILE_NAME" ]; then
              cp "scraper/${{ inputs.liga }}/$FILE_NAME" "public/static/"
              echo "✅ Archivo copiado"
            else
              find "scraper/${{ inputs.liga }}/" -name "*.json" -exec cp {} "public/static/" \;
            fi
          fi
          
      - name: Commit files
        run: |
          echo "google-chrome-stable_current_amd64.deb" >> .gitignore
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/static/*.json
          git add .
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: ${{ inputs.liga }} $(date '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Push completado"
          else
            echo "⚠️  NO HAY CAMBIOS"
          fi

  deploy:
    runs-on: ubuntu-latest
    if: |
      inputs.accion == 'deploy' || 
      (inputs.accion == 'scraper_and_deploy' && needs.scraper.result == 'success')
    needs: [scraper]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version
      
      - name: Verify files before deploy
        run: |
          echo "📋 Verificando archivos para deploy..."
          [ -d "public/static" ] && ls -la public/static/*.json 2>/dev/null | head -10
      
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          echo "✅ Deploy completado!"
