name: Panel Scraper

on:
  workflow_dispatch:
    inputs:
      accion:
        required: true
        type: choice
        options:
          - scraper
          - deploy
          - scraper_and_deploy
      liga:
        required: false
        type: choice
        default: liga_mx
        options:
          - arabia
          - argentina
          - australia
          - austria
          - belgica
          - bolivia
          - brasil
          - brasil_b
          - bulgaria
          - bundesliga
          - bundesliga_2
          - championship
          - checa
          - chile
          - china
          - croacia
          - dinamarca
          - ecuador
          - rumania
          - eerste_divisie
          - eredivisie
          - escocia
          - estonia
          - francia
          - francia_2
          - grecia
          - italia
          - italia_2
          - israel
          - j1_league
          - la_liga
          - libertadores
          - liga_betplay
          - liga_hypermotion
          - liga_mx
          - mls
          - nba
          - noruega
          - portugal
          - portugal_2
          - premier
          - sudamerica
          - suecia
          - suiza
          - turquia

jobs:
  scraper:
    runs-on: ubuntu-latest
    if: inputs.accion == 'scraper' || inputs.accion == 'scraper_and_deploy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Chrome
        run: |
          # Instalar Chrome estable
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb
          
          # Verificar versión de Chrome instalada
          CHROME_VERSION=$(google-chrome --version)
          echo "✅ Chrome instalado: $CHROME_VERSION"
          
          # Instalar Xvfb para display virtual
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          
      - name: Setup Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV
          
      - name: Clean ALL ChromeDriver Cache
        run: |
          # Limpiar COMPLETAMENTE el caché de ChromeDriver
          echo "🧹 Limpiando caché de ChromeDriver..."
          rm -rf ~/.local/share/undetected_chromedriver/ 2>/dev/null || true
          rm -rf /home/runner/.local/share/undetected_chromedriver/ 2>/dev/null || true
          rm -rf /home/runner/.wdm/ 2>/dev/null || true
          rm -rf ~/.wdm/ 2>/dev/null || true
          rm -rf /tmp/.com.google.Chrome.* 2>/dev/null || true
          rm -rf /tmp/chrome* 2>/dev/null || true
          echo "✅ Caché limpiado completamente"
          
      - name: Install Python dependencies with forced reinstall
        run: |
          pip install --upgrade pip
          # FORZAR reinstalación completa de undetected-chromedriver
          pip uninstall -y undetected-chromedriver selenium webdriver-manager 2>/dev/null || true
          pip install --no-cache-dir undetected-chromedriver==3.5.5
          pip install --no-cache-dir selenium==4.15.2
          pip install pandas requests beautifulsoup4
          echo "✅ Dependencias Python instaladas (frescas, sin caché)"
          
      - name: Verify versions
        run: |
          echo "=== VERIFICACIÓN DE VERSIONES ==="
          echo "Python: $(python3 --version)"
          echo "Chrome: $(google-chrome --version)"
          echo "Selenium: $(pip show selenium | grep Version)"
          echo "Undetected-chromedriver: $(pip show undetected-chromedriver | grep Version)"
          echo "===================================="
          
      - name: Run scraper
        run: |
          if [ "${{ inputs.liga }}" = "nba" ]; then
            echo "🏀 Ejecutando scraper NBA desde raíz..."
            echo "📂 Archivos ANTES de ejecutar nba.py:"
            ls -la *.json 2>/dev/null || echo "No hay archivos JSON antes"
            echo "📁 Directorio actual: $(pwd)"
            echo "🐍 Ejecutando nba.py con output completo..."
            python3 nba.py 2>&1 || echo "❌ Error en nba.py - código: $?"
            echo "📂 Archivos DESPUÉS de ejecutar nba.py:"
            ls -la *.json 2>/dev/null || echo "No hay archivos JSON después"
            echo "📁 Listando TODOS los archivos generados:"
            find . -name "*.json" -newer nba.py 2>/dev/null || echo "No se encontraron JSONs nuevos"
          else
            echo "⚽ Ejecutando scraper de fútbol..."
            cd "scraper/${{ inputs.liga }}"
            timeout 600 python3 "${{ inputs.liga }}_standings.py"
          fi
          
      - name: Move files to correct location
        run: |
          echo "📁 Moviendo archivos a la ubicación correcta..."
          
          # Definir el nombre del archivo según la liga
          case "${{ inputs.liga }}" in
            "la_liga") FILE_NAME="la_liga_data.json" ;;
            "liga_hypermotion") FILE_NAME="liga_hypermotion_data.json" ;;
            "premier") FILE_NAME="premier_league_data.json" ;;
            "austria") FILE_NAME="austria_data.json" ;;
            "championship") FILE_NAME="championship_data.json" ;;
            "bundesliga") FILE_NAME="bundesliga_data.json" ;;
            "bundesliga_2") FILE_NAME="bundesliga_2_data.json" ;;
            "rumania") FILE_NAME="rumania_data.json" ;;
            "italia") FILE_NAME="serie_a_data.json" ;;
            "israel") FILE_NAME="israel_data.json" ;;
            "italia_2") FILE_NAME="serie_b_data.json" ;;
            "francia") FILE_NAME="ligue_1_data.json" ;;
            "francia_2") FILE_NAME="ligue_2_data.json" ;;
            "eredivisie") FILE_NAME="eredivisie_data.json" ;;
            "dinamarca") FILE_NAME="dinamarca_data.json" ;;
            "eerste_divisie") FILE_NAME="eerste_divisie_data.json" ;;
            "portugal") FILE_NAME="primeira_liga_data.json" ;;
            "portugal_2") FILE_NAME="liga_portugal_2_data.json" ;;
            "argentina") FILE_NAME="primera_division_argentina_data.json" ;;
            "brasil") FILE_NAME="serie_a_brasil_data.json" ;;
            "brasil_b") FILE_NAME="serie_b_brasil_data.json" ;;
            "bulgaria") FILE_NAME="bulgaria_data.json" ;;
            "liga_mx") FILE_NAME="liga_mx_data.json" ;;
            "arabia") FILE_NAME="saudi-arabia_data.json" ;;
            "liga_betplay") FILE_NAME="liga_betplay_data.json" ;;
            "estonia") FILE_NAME="meistriliiga_data.json" ;;
            "escocia") FILE_NAME="scotland_premiership_data.json" ;;
            "j1_league") FILE_NAME="j1_league_data.json" ;;
            "china") FILE_NAME="super_league_china_data.json" ;;
            "suecia") FILE_NAME="allsvenskan_data.json" ;;
            "belgica") FILE_NAME="pro_league_belgium_data.json" ;;
            "noruega") FILE_NAME="eliteserien_data.json" ;;
            "suiza") FILE_NAME="super_league_suiza_data.json" ;;
            "turquia") FILE_NAME="super_lig_turkey_data.json" ;;
            "ecuador") FILE_NAME="serie_a_ecuador_data.json" ;;
            "mls") FILE_NAME="mls_usa_data.json" ;;
            "nba") echo "🏀 NBA genera múltiples archivos - no usa FILE_NAME único" ;;
            "australia") FILE_NAME="a_league_australia_data.json" ;;
            "grecia") FILE_NAME="super_league_greece_data.json" ;;
            "chile") FILE_NAME="primera_division_chile_data.json" ;;
            "checa") FILE_NAME="checa_data.json" ;;
            "croacia") FILE_NAME="croacia_data.json" ;;
            "libertadores") FILE_NAME="libertadores_data.json" ;;
            "sudamerica") FILE_NAME="sudamericana_data.json" ;;
            "bolivia") FILE_NAME="Lfpb.json" ;;
            *) FILE_NAME="${{ inputs.liga }}_data.json" ;;
          esac
          
          echo "Buscando archivo: $FILE_NAME"
          
          # Lógica especial para NBA
          if [ "${{ inputs.liga }}" = "nba" ]; then
            echo "🏀 NBA: Verificando archivos múltiples"
            NBA_FILES_FOUND=0
            for nba_file in "nba_standings.json" "nba_player_stats.json" "nba_games.json"; do
              if [ -f "public/static/$nba_file" ]; then
                echo "✅ NBA: ENCONTRADO public/static/$nba_file"
                ls -lh "public/static/$nba_file"
                NBA_FILES_FOUND=$((NBA_FILES_FOUND + 1))
              else
                echo "❌ NBA: NO encontrado public/static/$nba_file"
              fi
            done
            
            if [ $NBA_FILES_FOUND -lt 3 ]; then
              echo "🔄 NBA: Buscando archivos faltantes en raíz..."
              for nba_file in "nba_standings.json" "nba_player_stats.json" "nba_games.json"; do
                if [ -f "$nba_file" ] && [ ! -f "public/static/$nba_file" ]; then
                  cp "$nba_file" "public/static/"
                  echo "✅ NBA: Copiado $nba_file"
                fi
              done
            fi
          else
            # Lógica para otras ligas
            if [ -f "scraper/${{ inputs.liga }}/public/static/$FILE_NAME" ]; then
              echo "✅ ENCONTRADO en scraper/${{ inputs.liga }}/public/static/$FILE_NAME"
              cp "scraper/${{ inputs.liga }}/public/static/$FILE_NAME" "public/static/"
            elif [ -f "scraper/${{ inputs.liga }}/$FILE_NAME" ]; then
              echo "✅ ENCONTRADO en scraper/${{ inputs.liga }}/$FILE_NAME"
              cp "scraper/${{ inputs.liga }}/$FILE_NAME" "public/static/"
            else
              echo "❌ NO se encontró $FILE_NAME"
              JSON_COUNT=$(find "scraper/${{ inputs.liga }}/" -name "*.json" 2>/dev/null | wc -l)
              if [ $JSON_COUNT -gt 0 ]; then
                find "scraper/${{ inputs.liga }}/" -name "*.json" -exec cp {} "public/static/" \;
                echo "✅ Copiados $JSON_COUNT archivos JSON"
              fi
            fi
          fi
          
          # Agregar timestamp
          if [ "${{ inputs.liga }}" = "nba" ]; then
            for nba_file in "nba_standings.json" "nba_player_stats.json" "nba_games.json"; do
              if [ -f "public/static/$nba_file" ]; then
                sed -i '$ s/}/,"last_updated":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}/' "public/static/$nba_file"
              fi
            done
          elif [ -f "public/static/$FILE_NAME" ]; then
            sed -i '$ s/}/,"last_updated":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}/' "public/static/$FILE_NAME"
          fi
      
      - name: Commit files
        run: |
          # Asegurar que no se suba el .deb de Chrome
          echo "google-chrome-stable_current_amd64.deb" >> .gitignore
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/static/*.json
          git add .
          
          if ! git diff --cached --quiet; then
            echo "✅ HAY CAMBIOS - Creando commit..."
            git commit -m "Auto-update: ${{ inputs.liga }} $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🔄 Sincronizando con remote..."
            git pull --rebase origin main || echo "⚠️ Pull con conflictos, continuando..."
            echo "🚀 Haciendo push..."
            git push origin main
            echo "✅ Push completado"
          else
            echo "❌ NO HAY CAMBIOS para commitear"
          fi

  deploy:
    runs-on: ubuntu-latest
    if: |
      inputs.accion == 'deploy' || 
      (inputs.accion == 'scraper_and_deploy' && needs.scraper.result == 'success')
    needs: [scraper]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version
      
      - name: Verify files before deploy
        run: |
          echo "📋 Verificando archivos para deploy..."
          if [ -d "public" ]; then
            echo "✅ Carpeta public/ encontrada"
            if [ -d "public/static" ]; then
              echo "✅ Carpeta public/static/ encontrada"
              ls -la public/static/*.json 2>/dev/null | head -10
            else
              echo "❌ ERROR: No hay carpeta public/static/"
              exit 1
            fi
          else
            echo "❌ ERROR: No hay carpeta public/"
            exit 1
          fi
      
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "🚀 Desplegando a Firebase Hosting..."
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          echo "✅ Deploy completado!"
      
      - name: Post-deploy summary
        run: |
          echo "📊 RESUMEN DEL DEPLOY"
          if [ "${{ inputs.accion }}" = "scraper_and_deploy" ]; then
            echo "Liga scrapeada: ${{ inputs.liga }}"
          fi
          echo "Fecha: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Estado: ✅ EXITOSO"
