name: Auto Deploy Firebase

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '30 19 * * *'
  
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '¿Forzar deploy manual?'
        required: false
        type: boolean
        default: true

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🎯 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 🔧 Instalar Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version
          echo "✅ Firebase CLI instalado correctamente"
      
      - name: 🔍 Verificar archivos antes del deploy
        run: |
          echo "📂 Verificando estructura del proyecto..."
          echo ""
          echo "📁 Archivos en raíz:"
          ls -lh | head -10
          echo ""
          if [ -d "public" ]; then
            echo "✅ Carpeta public/ existe"
            echo ""
            echo "📁 Contenido de public/:"
            ls -lh public/ | head -10
            echo ""
            if [ -d "public/static" ]; then
              echo "✅ Carpeta public/static/ existe"
              echo ""
              echo "📊 Archivos JSON en public/static/:"
              ls -lh public/static/*.json 2>/dev/null | wc -l
              echo " archivos JSON encontrados"
              echo ""
              echo "📋 Últimos 10 archivos JSON:"
              ls -lht public/static/*.json 2>/dev/null | head -10
            else
              echo "❌ ERROR: No existe public/static/"
              exit 1
            fi
          else
            echo "❌ ERROR: No existe carpeta public/"
            exit 1
          fi
          
          if [ -f "firebase.json" ]; then
            echo "✅ firebase.json encontrado"
            cat firebase.json
          else
            echo "❌ ERROR: No se encontró firebase.json"
            exit 1
          fi
      
      - name: 🚀 Deploy a Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "🚀 Iniciando deploy a Firebase..."
          echo "📅 Fecha: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "🌐 Proyecto: CyborgBets"
          echo ""
          
          firebase deploy \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            --force \
            2>&1 | tee deploy_log.txt
          
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $DEPLOY_EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ =========================================="
            echo "✅ DEPLOY COMPLETADO EXITOSAMENTE"
            echo "✅ =========================================="
            echo "📅 Hora: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "🌐 Tu app está actualizada en Firebase"
          else
            echo ""
            echo "❌ =========================================="
            echo "❌ ERROR EN EL DEPLOY"
            echo "❌ =========================================="
            echo "🔍 Código de salida: $DEPLOY_EXIT_CODE"
            exit $DEPLOY_EXIT_CODE
          fi
      
      - name: 📊 Verificar deploy exitoso
        if: success()
        run: |
          echo "🎉 Deploy verificado correctamente"
          echo "📈 Estadísticas del deploy:"
          echo "   - Fecha: $(date '+%Y-%m-%d')"
          echo "   - Hora: $(date '+%H:%M:%S %Z')"
          echo "   - Archivos JSON desplegados: $(ls public/static/*.json 2>/dev/null | wc -l)"
          echo ""
          echo "🔗 Tu sitio debería estar actualizado en:"
          echo "   https://tu-proyecto.web.app"
      
      - name: 📝 Generar reporte de deploy
        if: always()
        run: |
          echo "📋 REPORTE DE DEPLOY AUTOMÁTICO" > deploy_report.txt
          echo "======================================" >> deploy_report.txt
          echo "📅 Fecha: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> deploy_report.txt
          echo "🔧 Trigger: ${{ github.event_name }}" >> deploy_report.txt
          echo "✅ Estado: ${{ job.status }}" >> deploy_report.txt
          echo "======================================" >> deploy_report.txt
          echo "" >> deploy_report.txt
          
          if [ -f "deploy_log.txt" ]; then
            echo "📄 Log del deploy:" >> deploy_report.txt
            cat deploy_log.txt >> deploy_report.txt
          fi
          
          cat deploy_report.txt
      
      - name: 🔔 Notificación final
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 =========================================="
            echo "🎉 DEPLOY AUTOMÁTICO COMPLETADO"
            echo "🎉 =========================================="
            echo "✅ Todo funcionó correctamente"
            echo "🌐 CyborgBets actualizado en Firebase"
            echo "📅 $(date '+%Y-%m-%d %H:%M:%S %Z')"
          else
            echo "❌ =========================================="
            echo "❌ ERROR EN DEPLOY AUTOMÁTICO"
            echo "❌ =========================================="
            echo "⚠️  Revisar logs arriba para detalles"
            echo "📅 $(date '+%Y-%m-%d %H:%M:%S %Z')"
          fi

  deploy-summary:
    runs-on: ubuntu-latest
    needs: [deploy-firebase]
    if: always()
    
    steps:
      - name: 📊 Resumen Final
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   RESUMEN DE DEPLOY AUTOMÁTICO         ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📅 Fecha: $(date '+%Y-%m-%d')"
          echo "🕐 Hora: $(date '+%H:%M:%S %Z')"
          echo "🎯 Tipo: ${{ github.event_name }}"
          echo ""
          echo "📦 Deploy Firebase: ${{ needs.deploy-firebase.result }}"
          echo ""
          if [ "${{ needs.deploy-firebase.result }}" == "success" ]; then
            echo "✅ Estado: ÉXITO TOTAL"
            echo "🎉 CyborgBets está actualizado"
          else
            echo "❌ Estado: FALLÓ"
            echo "⚠️  Revisar logs del job anterior"
          fi
          echo ""
          echo "═══════════════════════════════════════════"
