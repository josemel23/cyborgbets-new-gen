name: Smart Auto Update - All Leagues

on:
  schedule:
    - cron: '0 15 * * 1,3,5'
    - cron: '0 16 * * 1,3,5'
    - cron: '0 17 * * 1,3,5'
    - cron: '0 18 * * 1,3,5'
    - cron: '0 19 * * 1,3,5'
    - cron: '0 20 * * 1,3,5'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
  
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo de ligas a actualizar'
        required: false
        type: choice
        default: 'todas'
        options:
          - todas
          - top_europeas
          - segundas_divisiones
          - americanas
          - secundarias
          - asiaticas
          - nba

jobs:
  top-european-leagues:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 15 * * 1,3,5' ||
      github.event.schedule == '0 19 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'top_europeas'))
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        liga:
          - la_liga
          - premier
          - bundesliga
          - italia
          - francia
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 180000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  european-second-divisions:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 16 * * 1,3,5' ||
      github.event.schedule == '0 20 * * 1,3,5' ||
