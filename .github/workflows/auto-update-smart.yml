name: Smart Auto Update - All Leagues

on:
  schedule:
    # Ligas TOP Europeas - Lunes, Miércoles, Jueves a las 10am Colombia (3pm UTC)
    - cron: '0 15 * * 1,3,4'
    
    # Ligas TOP Europeas - Lunes, Miércoles, Jueves a las 2pm Colombia (7pm UTC)
    - cron: '0 19 * * 1,3,4'
    
    # Ligas Americanas - Lunes, Miércoles, Jueves a las 10am Colombia (3pm UTC)
    - cron: '0 15 * * 1,3,4'
    
    # Ligas Americanas - Lunes, Miércoles, Jueves a las 2pm Colombia (7pm UTC)
    - cron: '0 19 * * 1,3,4'
    
    # Ligas Secundarias - Lunes, Miércoles, Jueves a las 10am Colombia (3pm UTC)
    - cron: '0 15 * * 1,3,4'
    
    # Ligas Secundarias - Lunes, Miércoles, Jueves a las 2pm Colombia (7pm UTC)
    - cron: '0 19 * * 1,3,4'
    
    # NBA - TODOS LOS DÍAS a las 10am Colombia (3pm UTC)
    - cron: '0 15 * * *'
    
    # NBA - TODOS LOS DÍAS a las 2pm Colombia (7pm UTC)
    - cron: '0 19 * * *'
  
  # Botón manual para ejecutar todo
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo de ligas a actualizar'
        required: false
        type: choice
        default: 'todas'
        options:
          - todas
          - top_europeas
          - americanas
          - secundarias
          - nba

jobs:
  # ============================================
  # GRUPO 1: LIGAS TOP EUROPEAS
  # ============================================
  top-european-leagues:
    runs-on: ubuntu-latest
    if: |
      contains(fromJSON('["0 15 * * 1,3,4", "0 19 * * 1,3,4"]'), github.event.schedule) || 
      (github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'top_europeas'))
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        liga:
          - la_liga              # España - La Liga
          - liga_hypermotion     # España - Segunda
          - premier              # Inglaterra - Premier
          - championship         # Inglaterra - Championship
          - bundesliga           # Alemania - Bundesliga
          - bundesliga_2         # Alemania - Segunda
          - italia               # Italia - Serie A
          - italia_2             # Italia - Serie B
          - francia              # Francia - Ligue 1
          - francia_2            # Francia - Ligue 2
          - eredivisie           # Países Bajos - Eredivisie
          - eerste_divisie       # Países Bajos - Segunda
          - portugal             # Portugal - Primeira Liga
          - portugal_2           # Portugal - Liga 2
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'panel.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              
              // Esperar 2 minutos entre ligas
              await new Promise(resolve => setTimeout(resolve, 120000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 2: LIGAS AMERICANAS
  # ============================================
  american-leagues:
    runs-on: ubuntu-latest
    if: |
      contains(fromJSON('["0 15 * * 1,3,4", "0 19 * * 1,3,4"]'), github.event.schedule) || 
      (github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'americanas'))
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        liga:
          - argentina            # Argentina - Primera División
          - brasil               # Brasil - Serie A
          - brasil_b             # Brasil - Serie B
          - liga_mx              # México - Liga MX
          - liga_betplay         # Colombia - Liga BetPlay
          - chile                # Chile - Primera División
          - ecuador              # Ecuador - Serie A
          - bolivia              # Bolivia - LFPB
          - mls                  # USA - MLS
          - libertadores         # Copa Libertadores
          - sudamerica           # Copa Sudamericana
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'panel.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 120000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 3: LIGAS SECUNDARIAS
  # ============================================
  secondary-leagues:
    runs-on: ubuntu-latest
    if: |
      contains(fromJSON('["0 15 * * 1,3,4", "0 19 * * 1,3,4"]'), github.event.schedule) || 
      (github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'secundarias'))
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        liga:
          - belgica              # Bélgica - Pro League
          - suiza                # Suiza - Super League
          - escocia              # Escocia - Premiership
          - turquia              # Turquía - Süper Lig
          - grecia               # Grecia - Super League
          - dinamarca            # Dinamarca - Superliga
          - noruega              # Noruega - Eliteserien
          - suecia               # Suecia - Allsvenskan
          - austria              # Austria - Bundesliga
          - croacia              # Croacia - HNL
          - checa                # República Checa - Chance Liga
          - rumania              # Rumanía - Liga I
          - bulgaria             # Bulgaria - First League
          - israel               # Israel - Ligat ha'Al
          - arabia               # Arabia Saudita - Pro League
          - china                # China - Super League
          - j1_league            # Japón - J1 League
          - australia            # Australia - A-League
          - estonia              # Estonia - Meistriliiga
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'panel.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 120000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 4: NBA (TODOS LOS DÍAS)
  # ============================================
  nba-updates:
    runs-on: ubuntu-latest
    if: |
      contains(fromJSON('["0 15 * * *", "0 19 * * *"]'), github.event.schedule) || 
      (github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'nba'))
    
    steps:
      - name: Trigger NBA scraper
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'panel.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: 'nba'
                }
              });
              console.log('✅ NBA scraper iniciado');
            } catch (error) {
              console.error('❌ Error al iniciar NBA:', error);
            }

  # ============================================
  # REPORTE FINAL (opcional)
  # ============================================
  report-status:
    runs-on: ubuntu-latest
    needs: [top-european-leagues, american-leagues, secondary-leagues, nba-updates]
    if: always()
    
    steps:
      - name: Generate report
        run: |
          echo "📊 REPORTE DE ACTUALIZACIÓN AUTOMÁTICA"
          echo "======================================="
          echo "🕐 Fecha: $(date)"
          echo ""
          echo "✅ Top Europeas: ${{ needs.top-european-leagues.result }}"
          echo "✅ Americanas: ${{ needs.american-leagues.result }}"
          echo "✅ Secundarias: ${{ needs.secondary-leagues.result }}"
          echo "✅ NBA: ${{ needs.nba-updates.result }}"
          echo ""
          echo "🎉 Proceso completado"
