name: Smart Auto Update - All Leagues

on:
  schedule:
    # HORARIO 1: 10:00 AM Colombia - Ligas TOP Europeas (Lun, Mie, Vie)
    - cron: '0 15 * * 1,3,5'
    
    # HORARIO 2: 11:00 AM Colombia - Segundas Divisiones Europeas (Lun, Mie, Vie)
    - cron: '0 16 * * 1,3,5'
    
    # HORARIO 3: 12:00 PM Colombia - Ligas Americanas (Lun, Mie, Vie)
    - cron: '0 17 * * 1,3,5'
    
    # HORARIO 4: 1:00 PM Colombia - Ligas Secundarias + Asiáticas (Lun, Mie, Vie)
    - cron: '0 18 * * 1,3,5'
    
    # HORARIO 5: 2:00 PM Colombia - Segunda ronda Top Europeas (Lun, Mie, Vie)
    - cron: '0 19 * * 1,3,5'
    
    # HORARIO 6: 3:00 PM Colombia - Segunda ronda Segundas Divisiones (Lun, Mie, Vie)
    - cron: '0 20 * * 1,3,5'
    
    # NBA - TODOS LOS DÍAS a las 10:00 AM Colombia
    - cron: '0 15 * * *'
    # NBA - TODOS LOS DÍAS a las 2:00 PM Colombia
  
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo de ligas a actualizar'
        required: false
        type: choice
        default: 'todas'
        options:
          - todas
          - top_europeas
          - segundas_divisiones
          - americanas
          - secundarias
          - asiaticas
          - nba

jobs:
  # ============================================
  # GRUPO 1: LIGAS TOP EUROPEAS (10am y 2pm - SOLO Lun, Mie, Vie)
  # ============================================
  top-european-leagues:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 15 * * 1,3,5' ||
      github.event.schedule == '0 19 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'top_europeas'))
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        liga:
          - la_liga              # España - La Liga
          - premier              # Inglaterra - Premier
          - bundesliga           # Alemania - Bundesliga
          - italia               # Italia - Serie A
          - francia              # Francia - Ligue 1
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              
              // Esperar 3 minutos entre ligas
              await new Promise(resolve => setTimeout(resolve, 180000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 2: SEGUNDAS DIVISIONES EUROPEAS (11am y 3pm - SOLO Lun, Mie, Vie)
  # ============================================
  european-second-divisions:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 16 * * 1,3,5' ||
      github.event.schedule == '0 20 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'segundas_divisiones'))
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        liga:
          - liga_hypermotion     # España - Segunda
          - championship         # Inglaterra - Championship
          - bundesliga_2         # Alemania - Segunda
          - italia_2             # Italia - Serie B
          - francia_2            # Francia - Ligue 2
          - eredivisie           # Países Bajos - Eredivisie
          - eerste_divisie       # Países Bajos - Segunda
          - portugal             # Portugal - Primeira Liga
          - portugal_2           # Portugal - Liga 2
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 180000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 3: LIGAS AMERICANAS (12pm - SOLO Lun, Mie, Vie)
  # ============================================
  american-leagues:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 17 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'americanas'))
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        liga:
          - argentina            # Argentina
          - brasil               # Brasil - Serie A
          - brasil_b             # Brasil - Serie B
          - liga_mx              # México - Liga MX
          - liga_betplay         # Colombia - Liga BetPlay
          - chile                # Chile
          - ecuador              # Ecuador
          - bolivia              # Bolivia
          - mls                  # USA - MLS
          - libertadores         # Copa Libertadores
          - sudamerica           # Copa Sudamericana
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 180000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 4: LIGAS EUROPEAS SECUNDARIAS (1pm - SOLO Lun, Mie, Vie)
  # ============================================
  european-secondary-leagues:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 18 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'secundarias'))
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        liga:
          - belgica              # Bélgica
          - suiza                # Suiza
          - escocia              # Escocia
          - turquia              # Turquía
          - grecia               # Grecia
          - dinamarca            # Dinamarca
          - noruega              # Noruega
          - suecia               # Suecia
          - austria              # Austria
          - croacia              # Croacia
          - checa                # República Checa
          - rumania              # Rumanía
          - bulgaria             # Bulgaria
          - israel               # Israel
          - estonia              # Estonia
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 180000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 5: LIGAS ASIÁTICAS Y OTRAS (1pm - SOLO Lun, Mie, Vie)
  # ============================================
  asian-and-other-leagues:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 18 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'todas' || github.event.inputs.grupo == 'asiaticas'))
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        liga:
          - arabia               # Arabia Saudita
          - china                # China
          - j1_league            # Japón
          - australia            # Australia
    
    steps:
      - name: Trigger scraper for ${{ matrix.liga }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: '${{ matrix.liga }}'
                }
              });
              console.log('✅ Scraper iniciado para ${{ matrix.liga }}');
              await new Promise(resolve => setTimeout(resolve, 180000));
            } catch (error) {
              console.error('❌ Error al iniciar ${{ matrix.liga }}:', error);
            }

  # ============================================
  # GRUPO 6: NBA (4pm TODOS LOS DÍAS - ÚNICO JOB A LAS 4PM)
  # ============================================
  nba-updates:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 21 * * *' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.grupo == 'nba' || github.event.inputs.grupo == 'todas'))
    
    steps:
      - name: Trigger NBA scraper
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'execute.yml',
                ref: 'main',
                inputs: {
                  accion: 'scraper',
                  liga: 'nba'
                }
              });
              console.log('✅ NBA scraper iniciado');
            } catch (error) {
              console.error('❌ Error al iniciar NBA:', error);
            }

  # ============================================
  # REPORTE FINAL
  # ============================================
  report-status:
    runs-on: ubuntu-latest
    needs: [top-european-leagues, european-second-divisions, american-leagues, european-secondary-leagues, asian-and-other-leagues, nba-updates]
    if: always()
    
    steps:
      - name: Generate report
        run: |
          echo "📊 REPORTE DE ACTUALIZACIÓN AUTOMÁTICA"
          echo "=============================================="
          echo "🕐 Fecha: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "Top Europeas: ${{ needs.top-european-leagues.result }}"
          echo "Segundas Divisiones: ${{ needs.european-second-divisions.result }}"
          echo "Americanas: ${{ needs.american-leagues.result }}"
          echo "Secundarias Europeas: ${{ needs.european-secondary-leagues.result }}"
          echo "Asiáticas: ${{ needs.asian-and-other-leagues.result }}"
          echo "NBA: ${{ needs.nba-updates.result }}"
          echo ""
          echo "✅ Scrapers completados"
